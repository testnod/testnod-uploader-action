name: "TestNod Uploader"
description: "Upload JUnit XML test results to TestNod for tracking, flaky test detection, and alerting."
branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  token:
    description: "TestNod project token for authentication."
    required: true
  file:
    description: "Path to the JUnit XML file to upload. Required unless finalize=only."
    required: false
    default: ""
  tags:
    description: "Comma-separated list of tags to attach to the upload."
    required: false
    default: ""
  ignore-failures:
    description: "If true, the action will not fail the workflow when the upload or finalize encounters an error, including a 403 when uploads are paused. Errors are logged as warnings."
    required: false
    default: "false"
  uploader-version:
    description: "Version of the TestNod uploader binary to download. Defaults to 'latest'."
    required: false
    default: "latest"
  build-id:
    description: "Build identifier used to group parallel/matrix shards into one logical test run. Defaults to github.run_id."
    required: false
    default: ""
  finalize:
    description: "When to call TestNod's finalize endpoint. 'true' (default) uploads then finalizes — right for single-job workflows. 'false' uploads only — use on per-shard steps in a matrix. 'only' skips upload and just finalizes — use in a separate aggregate job that runs after all matrix shards complete."
    required: false
    default: "true"
  retry:
    description: "If true, marks this upload as a rerun of tests that failed earlier in the same build. Use the same build-id as the original upload, usually with finalize: false. Requires uploader-version v0.1.0 or later."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Check test results file
      id: check-file
      if: inputs.finalize != 'only' && inputs.file != ''
      shell: bash
      env:
        TESTNOD_FILE: ${{ inputs.file }}
      run: |
        if [ ! -f "$TESTNOD_FILE" ]; then
          echo "::warning::Test results file '$TESTNOD_FILE' not found — skipping TestNod upload. This usually means a step before the tests failed."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Determine platform and architecture
      id: platform
      if: inputs.finalize != 'only' && steps.check-file.outputs.skip != 'true'
      shell: bash
      env:
        # Use the runner's reported OS/arch rather than uname, which reports x86_64
        # under emulation (e.g. Git Bash on Windows ARM64)
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        case "$RUNNER_OS_NAME" in
          Linux)   PLATFORM="linux" ;;
          macOS)   PLATFORM="darwin" ;;
          Windows) PLATFORM="windows" ;;
          *)
            echo "::error::Unsupported OS: $RUNNER_OS_NAME"
            exit 1
            ;;
        esac

        case "$RUNNER_ARCH_NAME" in
          X64)   ARCH="amd64" ;;
          ARM64) ARCH="arm64" ;;
          *)
            echo "::error::Unsupported architecture: $RUNNER_ARCH_NAME"
            exit 1
            ;;
        esac

        EXTENSION=""
        if [ "$PLATFORM" = "windows" ]; then
          EXTENSION=".exe"
        fi

        BINARY_NAME="testnod-uploader-${PLATFORM}-${ARCH}${EXTENSION}"

        echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
        echo "extension=$EXTENSION" >> "$GITHUB_OUTPUT"
        echo "binary-name=$BINARY_NAME" >> "$GITHUB_OUTPUT"

    - name: Resolve uploader version
      id: version
      if: inputs.finalize != 'only' && steps.check-file.outputs.skip != 'true'
      shell: bash
      env:
        UPLOADER_VERSION: ${{ inputs.uploader-version }}
        TESTNOD_IGNORE_FAILURES: ${{ inputs.ignore-failures }}
      run: |
        VERSION="$UPLOADER_VERSION"

        # Resolve "latest" to a concrete version and download from that version's
        # path. The CDN can keep serving a cached latest/ binary for hours after a
        # release, while latest/checksums.txt is already new, so the two wouldn't match.
        if [ "$VERSION" = "latest" ]; then
          VERSION_URL="https://releases.testnod.com/testnod-uploader/latest/VERSION"
          if ! VERSION=$(curl -fsSL --retry 3 --retry-delay 5 "$VERSION_URL" | tr -d '[:space:]') || [ -z "$VERSION" ]; then
            MESSAGE="Failed to resolve the latest TestNod uploader version from ${VERSION_URL}."
            if [ "$TESTNOD_IGNORE_FAILURES" != "true" ]; then
              echo "::error::${MESSAGE}"
              exit 1
            fi
            echo "::warning::${MESSAGE} Skipping TestNod upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Resolved latest TestNod uploader version: ${VERSION}"
        fi

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # Each version gets its own directory, so a cache entry only ever holds the
    # binary for the version in its key, even when a job runs several versions
    - name: Restore cached binary
      if: inputs.finalize != 'only' && inputs.uploader-version != 'latest' && steps.check-file.outputs.skip != 'true'
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/testnod-uploader/${{ steps.version.outputs.version }}
        key: testnod-uploader-${{ inputs.uploader-version }}-${{ steps.platform.outputs.platform }}-${{ steps.platform.outputs.arch }}

    - name: Download TestNod uploader
      id: download
      if: inputs.finalize != 'only' && (inputs.uploader-version == 'latest' || steps.cache.outputs.cache-hit != 'true') && steps.check-file.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
      shell: bash
      env:
        UPLOADER_VERSION: ${{ steps.version.outputs.version }}
        BINARY_NAME: ${{ steps.platform.outputs.binary-name }}
        TESTNOD_IGNORE_FAILURES: ${{ inputs.ignore-failures }}
      run: |
        RELEASE_URL="https://releases.testnod.com/testnod-uploader/${UPLOADER_VERSION}"
        DOWNLOAD_URL="${RELEASE_URL}/${BINARY_NAME}"
        CHECKSUMS_URL="${RELEASE_URL}/checksums.txt"
        DEST_DIR="${RUNNER_TEMP}/testnod-uploader/${UPLOADER_VERSION}"

        # Removes the directory so actions/cache doesn't save a partial or unverified
        # binary, then fails the step or skips the upload depending on ignore-failures.
        fail_download() {
          rm -rf "$DEST_DIR"
          if [ "$TESTNOD_IGNORE_FAILURES" != "true" ]; then
            echo "::error::$1"
            exit 1
          fi
          echo "::warning::$1 Skipping TestNod upload."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        }

        mkdir -p "$DEST_DIR"

        echo "Downloading TestNod uploader from ${DOWNLOAD_URL}"
        if ! curl -fsSL --retry 3 --retry-delay 5 -o "${DEST_DIR}/${BINARY_NAME}" "$DOWNLOAD_URL"; then
          fail_download "Failed to download TestNod uploader from ${DOWNLOAD_URL}."
        fi

        if ! CHECKSUMS=$(curl -fsSL --retry 3 --retry-delay 5 "$CHECKSUMS_URL"); then
          fail_download "Failed to download checksums from ${CHECKSUMS_URL}."
        fi

        EXPECTED_SHA=$(echo "$CHECKSUMS" | awk -v name="$BINARY_NAME" '$2 == name { print $1 }')
        if [ -z "$EXPECTED_SHA" ]; then
          fail_download "No checksum for ${BINARY_NAME} in ${CHECKSUMS_URL}."
        fi

        # sha256sum ships with Linux and Git Bash on Windows; macOS has shasum instead.
        # Hash from stdin: given a path with backslashes (RUNNER_TEMP on Windows),
        # sha256sum escapes it and prefixes the hash with "\".
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL_SHA=$(sha256sum < "${DEST_DIR}/${BINARY_NAME}" | awk '{ print $1 }')
        else
          ACTUAL_SHA=$(shasum -a 256 < "${DEST_DIR}/${BINARY_NAME}" | awk '{ print $1 }')
        fi

        if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
          fail_download "Checksum mismatch for ${BINARY_NAME}: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."
        fi

        echo "Verified SHA-256 checksum for ${BINARY_NAME}."
        chmod +x "${DEST_DIR}/${BINARY_NAME}"

    - name: Run TestNod uploader
      if: steps.check-file.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.download.outputs.skip != 'true'
      shell: bash
      env:
        TESTNOD_TOKEN: ${{ inputs.token }}
        TESTNOD_FILE: ${{ inputs.file }}
        TESTNOD_TAGS: ${{ inputs.tags }}
        TESTNOD_IGNORE_FAILURES: ${{ inputs.ignore-failures }}
        TESTNOD_RETRY: ${{ inputs.retry }}
        BUILD_ID_INPUT: ${{ inputs.build-id }}
        FINALIZE_MODE: ${{ inputs.finalize }}
        BINARY_NAME: ${{ steps.platform.outputs.binary-name }}
        UPLOADER_VERSION: ${{ steps.version.outputs.version }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        case "$FINALIZE_MODE" in
          true|false|only) ;;
          *)
            echo "::error::Invalid 'finalize' value: '${FINALIZE_MODE}'. Must be 'true', 'false', or 'only'."
            exit 1
            ;;
        esac

        EFFECTIVE_BUILD_ID="${BUILD_ID_INPUT:-$GITHUB_RUN_ID}"
        UPLOAD_FAILED=false

        # Writes a GitHub annotation. A "%" in the message would start an escape sequence.
        annotate() {
          echo "::$1::${2//\%/%25}"
        }

        # Fails the step, or with ignore-failures logs a warning and carries on.
        fail_or_warn() {
          if [ "$TESTNOD_IGNORE_FAILURES" != "true" ]; then
            annotate error "$1"
            exit 1
          fi
          annotate warning "$1"
        }

        if [ "$FINALIZE_MODE" != "only" ]; then
          if [ -z "$TESTNOD_FILE" ]; then
            echo "::error::'file' input is required unless finalize=only."
            exit 1
          fi

          BINARY_PATH="${RUNNER_TEMP}/testnod-uploader/${UPLOADER_VERSION}/${BINARY_NAME}"

          ARGS=(
            -token="$TESTNOD_TOKEN"
            -branch="$BRANCH"
            -commit-sha="$COMMIT_SHA"
            -run-url="$RUN_URL"
            -build-id="$EFFECTIVE_BUILD_ID"
          )

          # Split comma-separated tags into individual -tag flags
          if [ -n "$TESTNOD_TAGS" ]; then
            IFS=',' read -ra TAG_ARRAY <<< "$TESTNOD_TAGS"
            for tag in "${TAG_ARRAY[@]}"; do
              tag=$(echo "$tag" | xargs)  # trim whitespace
              if [ -n "$tag" ]; then
                ARGS+=(-tag="$tag")
              fi
            done
          fi

          if [ "$TESTNOD_RETRY" = "true" ]; then
            ARGS+=(-retry)
          fi

          # File path is a positional argument, not a flag
          ARGS+=("$TESTNOD_FILE")

          # The uploader prints the reason for a failure, including the server's
          # error_message (for example, why a 403 refused the upload). Keep a copy so
          # the reason can be repeated as an annotation. ignore-failures is handled
          # here rather than with the uploader's -ignore-failures flag, so the step
          # still sees the exit status.
          UPLOAD_LOG="${RUNNER_TEMP}/testnod-uploader.log"
          echo "Running TestNod uploader..."
          set +e
          "$BINARY_PATH" "${ARGS[@]}" 2>&1 | tee "$UPLOAD_LOG"
          UPLOAD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$UPLOAD_STATUS" -ne 0 ]; then
            UPLOAD_FAILED=true
            REASON=$(grep -E '^(Error creating test run on TestNod|File validation failed|There was an error uploading the file to TestNod): ' "$UPLOAD_LOG" | tail -n 1 || true)
            fail_or_warn "${REASON:-The TestNod uploader exited with status ${UPLOAD_STATUS}. See its output above.}"
          fi
        fi

        if [ "$FINALIZE_MODE" = "true" ] || [ "$FINALIZE_MODE" = "only" ]; then
          BASE_URL="${TESTNOD_BASE_URL:-https://testnod.com}"
          FINALIZE_BODY="${RUNNER_TEMP}/testnod-finalize.body"
          echo "Finalizing TestNod test run for build ${EFFECTIVE_BUILD_ID}..."

          HTTP_CODE=$(curl -sS -o "$FINALIZE_BODY" -w "%{http_code}" \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST "${BASE_URL}/integrations/test_runs/finalize" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Project-Token: ${TESTNOD_TOKEN}" \
            -d "{\"build_id\":\"${EFFECTIVE_BUILD_ID}\"}") || true

          if [ "$HTTP_CODE" = "000" ] || [ -z "$HTTP_CODE" ]; then
            # curl couldn't get a response at all (DNS failure, connection refused, timeout)
            fail_or_warn "Finalize request to ${BASE_URL} failed: no response from server."
          elif [[ "$HTTP_CODE" != 2?? ]]; then
            BODY=$(cat "$FINALIZE_BODY" 2>/dev/null || true)
            MESSAGE=$(printf '%s' "$BODY" | sed -n 's/.*"error_message"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)
            MESSAGE="${MESSAGE:-$BODY}"

            if [ "$HTTP_CODE" = "404" ] && [ "$UPLOAD_FAILED" = "true" ]; then
              # The upload failure was already reported; a second warning would bury it
              echo "Nothing to finalize for build ${EFFECTIVE_BUILD_ID} because the upload above failed (${MESSAGE})."
            elif [ "$HTTP_CODE" = "404" ] && [[ "$MESSAGE" == "Test run not found"* ]]; then
              fail_or_warn "Finalize returned HTTP 404: ${MESSAGE} No test run exists for build ${EFFECTIVE_BUILD_ID}. If the upload steps for this build failed, for example with a 403 because uploads are paused for the organization or project, the reason is in their logs."
            else
              fail_or_warn "Finalize returned HTTP ${HTTP_CODE}: ${MESSAGE}"
            fi
          else
            echo "Test run finalized."
          fi
        fi
