name: "TestNod Uploader"
description: "Upload JUnit XML test results to TestNod for tracking, flaky test detection, and alerting."
branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  token:
    description: "TestNod API token for authentication."
    required: true
  file:
    description: "Path to the JUnit XML file to upload. Required unless finalize=only."
    required: false
    default: ""
  tags:
    description: "Comma-separated list of tags to attach to the upload."
    required: false
    default: ""
  ignore-failures:
    description: "If true, the action will not fail the workflow when the upload encounters an error."
    required: false
    default: "false"
  uploader-version:
    description: "Version of the TestNod uploader binary to download. Defaults to 'latest'."
    required: false
    default: "latest"
  build-id:
    description: "Build identifier used to group parallel/matrix shards into one logical test run. Defaults to github.run_id."
    required: false
    default: ""
  finalize:
    description: "When to call TestNod's finalize endpoint. 'true' (default) uploads then finalizes — right for single-job workflows. 'false' uploads only — use on per-shard steps in a matrix. 'only' skips upload and just finalizes — use in a separate aggregate job that runs after all matrix shards complete."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Check test results file
      id: check-file
      if: inputs.finalize != 'only' && inputs.file != ''
      shell: bash
      env:
        TESTNOD_FILE: ${{ inputs.file }}
      run: |
        if [ ! -f "$TESTNOD_FILE" ]; then
          echo "::warning::Test results file '$TESTNOD_FILE' not found — skipping TestNod upload. This usually means a step before the tests failed."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Determine platform and architecture
      id: platform
      if: inputs.finalize != 'only' && steps.check-file.outputs.skip != 'true'
      shell: bash
      env:
        # Use the runner's reported OS/arch rather than uname, which reports x86_64
        # under emulation (e.g. Git Bash on Windows ARM64)
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        case "$RUNNER_OS_NAME" in
          Linux)   PLATFORM="linux" ;;
          macOS)   PLATFORM="darwin" ;;
          Windows) PLATFORM="windows" ;;
          *)
            echo "::error::Unsupported OS: $RUNNER_OS_NAME"
            exit 1
            ;;
        esac

        case "$RUNNER_ARCH_NAME" in
          X64)   ARCH="amd64" ;;
          ARM64) ARCH="arm64" ;;
          *)
            echo "::error::Unsupported architecture: $RUNNER_ARCH_NAME"
            exit 1
            ;;
        esac

        EXTENSION=""
        if [ "$PLATFORM" = "windows" ]; then
          EXTENSION=".exe"
        fi

        BINARY_NAME="testnod-uploader-${PLATFORM}-${ARCH}${EXTENSION}"

        echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
        echo "extension=$EXTENSION" >> "$GITHUB_OUTPUT"
        echo "binary-name=$BINARY_NAME" >> "$GITHUB_OUTPUT"

    - name: Restore cached binary
      if: inputs.finalize != 'only' && inputs.uploader-version != 'latest' && steps.check-file.outputs.skip != 'true'
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/testnod-uploader
        key: testnod-uploader-${{ inputs.uploader-version }}-${{ steps.platform.outputs.platform }}-${{ steps.platform.outputs.arch }}

    - name: Download TestNod uploader
      id: download
      if: inputs.finalize != 'only' && (inputs.uploader-version == 'latest' || steps.cache.outputs.cache-hit != 'true') && steps.check-file.outputs.skip != 'true'
      shell: bash
      env:
        UPLOADER_VERSION: ${{ inputs.uploader-version }}
        BINARY_NAME: ${{ steps.platform.outputs.binary-name }}
        TESTNOD_IGNORE_FAILURES: ${{ inputs.ignore-failures }}
      run: |
        RELEASE_URL="https://releases.testnod.com/testnod-uploader/${UPLOADER_VERSION}"
        DOWNLOAD_URL="${RELEASE_URL}/${BINARY_NAME}"
        CHECKSUMS_URL="${RELEASE_URL}/checksums.txt"
        DEST_DIR="${RUNNER_TEMP}/testnod-uploader"

        # Removes the directory so actions/cache doesn't save a partial or unverified
        # binary, then fails the step or skips the upload depending on ignore-failures.
        fail_download() {
          rm -rf "$DEST_DIR"
          if [ "$TESTNOD_IGNORE_FAILURES" != "true" ]; then
            echo "::error::$1"
            exit 1
          fi
          echo "::warning::$1 Skipping TestNod upload."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        }

        mkdir -p "$DEST_DIR"

        echo "Downloading TestNod uploader from ${DOWNLOAD_URL}"
        if ! curl -fsSL --retry 3 --retry-delay 5 -o "${DEST_DIR}/${BINARY_NAME}" "$DOWNLOAD_URL"; then
          fail_download "Failed to download TestNod uploader from ${DOWNLOAD_URL}."
        fi

        if ! CHECKSUMS=$(curl -fsSL --retry 3 --retry-delay 5 "$CHECKSUMS_URL"); then
          fail_download "Failed to download checksums from ${CHECKSUMS_URL}."
        fi

        EXPECTED_SHA=$(echo "$CHECKSUMS" | awk -v name="$BINARY_NAME" '$2 == name { print $1 }')
        if [ -z "$EXPECTED_SHA" ]; then
          fail_download "No checksum for ${BINARY_NAME} in ${CHECKSUMS_URL}."
        fi

        # sha256sum ships with Linux and Git Bash on Windows; macOS has shasum instead.
        # Hash from stdin: given a path with backslashes (RUNNER_TEMP on Windows),
        # sha256sum escapes it and prefixes the hash with "\".
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL_SHA=$(sha256sum < "${DEST_DIR}/${BINARY_NAME}" | awk '{ print $1 }')
        else
          ACTUAL_SHA=$(shasum -a 256 < "${DEST_DIR}/${BINARY_NAME}" | awk '{ print $1 }')
        fi

        if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
          fail_download "Checksum mismatch for ${BINARY_NAME}: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."
        fi

        echo "Verified SHA-256 checksum for ${BINARY_NAME}."
        chmod +x "${DEST_DIR}/${BINARY_NAME}"

    - name: Run TestNod uploader
      if: steps.check-file.outputs.skip != 'true' && steps.download.outputs.skip != 'true'
      shell: bash
      env:
        TESTNOD_TOKEN: ${{ inputs.token }}
        TESTNOD_FILE: ${{ inputs.file }}
        TESTNOD_TAGS: ${{ inputs.tags }}
        TESTNOD_IGNORE_FAILURES: ${{ inputs.ignore-failures }}
        BUILD_ID_INPUT: ${{ inputs.build-id }}
        FINALIZE_MODE: ${{ inputs.finalize }}
        BINARY_NAME: ${{ steps.platform.outputs.binary-name }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        case "$FINALIZE_MODE" in
          true|false|only) ;;
          *)
            echo "::error::Invalid 'finalize' value: '${FINALIZE_MODE}'. Must be 'true', 'false', or 'only'."
            exit 1
            ;;
        esac

        EFFECTIVE_BUILD_ID="${BUILD_ID_INPUT:-$GITHUB_RUN_ID}"

        if [ "$FINALIZE_MODE" != "only" ]; then
          if [ -z "$TESTNOD_FILE" ]; then
            echo "::error::'file' input is required unless finalize=only."
            exit 1
          fi

          BINARY_PATH="${RUNNER_TEMP}/testnod-uploader/${BINARY_NAME}"

          ARGS=(
            -token="$TESTNOD_TOKEN"
            -branch="$BRANCH"
            -commit-sha="$COMMIT_SHA"
            -run-url="$RUN_URL"
            -build-id="$EFFECTIVE_BUILD_ID"
          )

          # Split comma-separated tags into individual -tag flags
          if [ -n "$TESTNOD_TAGS" ]; then
            IFS=',' read -ra TAG_ARRAY <<< "$TESTNOD_TAGS"
            for tag in "${TAG_ARRAY[@]}"; do
              tag=$(echo "$tag" | xargs)  # trim whitespace
              if [ -n "$tag" ]; then
                ARGS+=(-tag="$tag")
              fi
            done
          fi

          if [ "$TESTNOD_IGNORE_FAILURES" = "true" ]; then
            ARGS+=(-ignore-failures)
          fi

          # File path is a positional argument, not a flag
          ARGS+=("$TESTNOD_FILE")

          echo "Running TestNod uploader..."
          "$BINARY_PATH" "${ARGS[@]}"
        fi

        if [ "$FINALIZE_MODE" = "true" ] || [ "$FINALIZE_MODE" = "only" ]; then
          BASE_URL="${TESTNOD_BASE_URL:-https://testnod.com}"
          FINALIZE_BODY="${RUNNER_TEMP}/testnod-finalize.body"
          echo "Finalizing TestNod test run for build ${EFFECTIVE_BUILD_ID}..."

          HTTP_CODE=$(curl -sS -o "$FINALIZE_BODY" -w "%{http_code}" \
            --retry 3 --retry-delay 2 --retry-connrefused \
            -X POST "${BASE_URL}/integrations/test_runs/finalize" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Project-Token: ${TESTNOD_TOKEN}" \
            -d "{\"build_id\":\"${EFFECTIVE_BUILD_ID}\"}") || true

          if [ "$HTTP_CODE" = "000" ] || [ -z "$HTTP_CODE" ]; then
            # curl couldn't get a response at all (DNS failure, connection refused, timeout)
            echo "::warning::Finalize request to ${BASE_URL} failed: no response from server."
            if [ "$TESTNOD_IGNORE_FAILURES" != "true" ]; then
              exit 1
            fi
          elif [[ "$HTTP_CODE" != 2?? ]]; then
            BODY=$(cat "$FINALIZE_BODY" 2>/dev/null || true)
            echo "::warning::Finalize returned HTTP ${HTTP_CODE}: ${BODY}"
            if [ "$TESTNOD_IGNORE_FAILURES" != "true" ]; then
              exit 1
            fi
          else
            echo "Test run finalized."
          fi
        fi
